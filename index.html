<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1c1917" />
  <meta name="description" content="Explore Native American Art — in-store museum learning gallery for Tanner Trading / Fifth Generation Trading Co." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Explore Native American Art" />
  <title>Explore Native American Art</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/icon-180.png" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <a class="sr-only" href="#app">Skip to content</a>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-block">
        <div class="brand-row">
          <img class="brand-logo" src="./assets/brand/tanner-trading-logo-header.webp" width="160" height="87" alt="Tanner Trading" />
          <div class="brand-text">
            <p class="brand-title">Explore Native American Art</p>
          </div>
        </div>
      </div>
      <div class="top-actions">
        <button type="button" class="btn btn-ghost" data-go="home" id="homeBtn">Home</button>
      </div>
    </header>
    <main class="main" id="app" tabindex="-1"></main>
  </div>
  <div id="live" class="sr-only" aria-live="polite"></div>
  <noscript>
    <p style="padding:24px;font-family:system-ui">JavaScript is required for this learning guide.</p>
  </noscript>
  <script src="./js/content.js"></script>
  <script src="./js/app.js"></script>
  <script>
    // Topbar Home uses same navigation as in-app buttons
    document.getElementById("homeBtn").addEventListener("click", function () {
      if (window.ENA_APP) window.ENA_APP.goHome();
    });
  </script>
</body>
</html>
